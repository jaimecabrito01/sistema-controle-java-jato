spring.application.name=java-jato
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carwash_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password_app}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}


#flayway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true 
