version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: lava-jato-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: lavajato-db
    ports:
      - "5432:5432"
    volumes:
      - lavajato_data:/var/lib/postgresql/data


  redis:
    image: redis:6-alpine
    container_name: redis_cache
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data 
    networks:
      - lavajato_net

volumes:
  lavajato_data:
  redis_data:
networks:
  lavajato_net:
    driver: bridge